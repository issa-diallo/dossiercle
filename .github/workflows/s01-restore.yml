name: S01 T09 isolated restore
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read

jobs:
  restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Bind candidate and create fresh restore worktree
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$EUID" -ne 0
          test "$(stat -f -c %T /dev/shm)" = tmpfs
          read -r available block_size < <(stat -f -c '%a %S' /dev/shm)
          if (( available * block_size < 2 * 1024 * 1024 * 1024 )); then
            echo 'The restore suite requires at least 2 GiB of free tmpfs.' >&2
            exit 1
          fi
          git worktree add -b feat/84-s01-t09-restore "$GITHUB_WORKSPACE/worktrees/84-s01-t09-restore" "$HEAD_SHA"
          {
            printf 'Candidate: %s\n\nBase: %s\n\n' "$HEAD_SHA" "$BASE_SHA"
            printf 'Tree: %s\n\nRun: %s (attempt %s)\n\n' "$(git rev-parse 'HEAD^{tree}')" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            printf '\x60\x60\x60\n'
            sha256sum infra/local/compose.yaml infra/local/versions.json
            printf '\x60\x60\x60\n'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Install Firefox NSS tooling
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libnss3-tools
      - name: Verify guards and prepare synthetic services
        working-directory: ${{ github.workspace }}/worktrees/84-s01-t09-restore
        shell: bash
        run: |
          python3 scripts/s01-worktree-identity-test.py
          python3 scripts/s01-worktree-privacy-test.py
          python3 scripts/s01-t06-environment-check-test.py
          umask 077
          if bash scripts/worktree-setup.sh --synthetic > "$RUNNER_TEMP/s01-restore-setup.log" 2>&1; then
            echo 'Synthetic services prepared.'
          else
            status=$?
            printf 'Synthetic setup failed (exit %s).\n' "$status" >&2
            exit "$status"
          fi
      - name: Verify isolated restoration under current authority
        working-directory: ${{ github.workspace }}/worktrees/84-s01-t09-restore
        shell: bash
        run: |
          export PATH="$PWD/.local/node/bin:$PWD/.local/pnpm-native/package:$PATH"
          export PLAYWRIGHT_BROWSERS_PATH="$PWD/.local/playwright-browsers"
          pnpm exec playwright install-deps firefox
          umask 077
          test_file=packages/adapters/test/s01-restore.qualification.ts
          proof="$RUNNER_TEMP/s01-restore-results.json"
          if pnpm exec vitest run --project qualification-restore --reporter=json --outputFile="$proof" "$test_file" \
            > "$RUNNER_TEMP/s01-restore-test.log" 2>&1; then
            jq -e --arg name "$PWD/$test_file" '
              .success == true and .numTotalTests == 2 and .numPassedTests == 2
              and .numFailedTests == 0 and .numPendingTests == 0 and .numTodoTests == 0
              and (.testResults | length == 1)
              and (.testResults[0] | .name == $name and .status == "passed"
                and ([.assertionResults[].status] == ["passed", "passed"]))
            ' "$proof" > /dev/null
          else
            status=$?
            printf 'Restore qualification failed (exit %s).\n' "$status" >&2
            exit "$status"
          fi
          echo 'Restore qualification: 2 passed, 0 skipped.' >> "$GITHUB_STEP_SUMMARY"
