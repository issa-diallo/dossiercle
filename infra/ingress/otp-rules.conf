# No request bodies, headers or OTP values in logs. T04 adds adversarial qualification.
SecRule REQBODY_ERROR "!@eq 0" "id:100001,phase:2,deny,status:400,nolog,noauditlog"
SecRule INBOUND_DATA_ERROR "!@eq 0" "id:100002,phase:2,deny,status:400,nolog,noauditlog"
SecRule REQUEST_METHOD "@streq POST" "id:100003,phase:1,chain,deny,status:415,nolog,noauditlog"
SecRule REQUEST_URI "@contains /login-actions/" "chain"
SecRule REQUEST_HEADERS:Content-Type "!@rx ^application/x-www-form-urlencoded(?:;\\s*charset=UTF-8)?$" "t:none"
SecRule REQUEST_METHOD "@streq POST" "id:100004,phase:2,chain,deny,status:400,nolog,noauditlog"
SecRule REQUEST_URI "@contains /login-actions/" "chain"
SecRule ARGS_NAMES "@rx ^(?:scope|id_token_hint)$" "t:urlDecodeUni,t:lowercase"
