load_module modules/ngx_http_modsecurity_module.so;
pid /tmp/nginx.pid;
error_log /dev/null crit;
events { worker_connections 128; }
http {
  resolver 127.0.0.11 valid=2s;
  # Reject ambiguous semicolon action paths after NGINX normalization.
  # The coordinator authorizes every emitted native credential action.
  map "$request_method:$uri" $s01_deny_required_action {
    default 0;
    "~*^POST:/realms/dossiercle/login-actions(?:;|/[^?]*;)" 1;
  }
  map $uri $s01_referrer_policy {
    default no-referrer;
    ~^/realms/dossiercle/ strict-origin;
  }
  access_log off;
  server_tokens off;
  client_max_body_size 32k;
  client_body_buffer_size 32k;
  client_body_temp_path /tmp/client-body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  proxy_buffering off;
  proxy_request_buffering off;
  modsecurity on;
  modsecurity_rules_file /etc/s01/modsecurity.conf;
  # Private native bridge. No host port; dedicated CA authorizes only coordinator.
  server {
    listen 9443 ssl;
    ssl_certificate /run/s01-tls/server.crt;
    ssl_certificate_key /run/s01-tls/server.key;
    ssl_client_certificate /run/s01-tls/coordinator-ca.crt;
    ssl_verify_client on;
    ssl_verify_depth 1;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Cache-Control "no-store" always;
    location / {
      if ($http_x_s01_native_user !~ "^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}@dossiercle$") { return 403; }
      include /etc/nginx/uwsgi_params;
      uwsgi_param REMOTE_USER $http_x_s01_native_user;
      uwsgi_pass suwsgi://privacyidea:8444;
      uwsgi_ssl_verify on;
      uwsgi_ssl_server_name on;
      uwsgi_ssl_name privacyidea;
      uwsgi_ssl_trusted_certificate /run/s01-tls/ca.crt;
      uwsgi_buffering off;
      uwsgi_request_buffering off;
      uwsgi_max_temp_file_size 0;
    }
  }
  server {
    listen 8443 ssl;
    ssl_certificate /run/s01-tls/server.crt;
    ssl_certificate_key /run/s01-tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy $s01_referrer_policy always;
    add_header X-Content-Type-Options "nosniff" always;
    location = /health { return 200 'synthetic bootstrap'; }
    # Every native browser route passes through the grant/J1 coordinator.
    location / {
      if ($host != localhost) { return 503; }
      if ($s01_deny_required_action = 1) { return 403; }
      set $coordinator identity-coordinator:4001;
      proxy_pass https://$coordinator;
      proxy_ssl_verify on;
      proxy_ssl_server_name on;
      proxy_ssl_name identity-coordinator;
      proxy_ssl_trusted_certificate /run/s01-tls/ca.crt;
      proxy_set_header Host $http_host;
      proxy_set_header X-S01-Native-User "";
      proxy_set_header Remote-User "";
      proxy_set_header X-Remote-User "";
      proxy_intercept_errors on;
      error_page 502 504 =503 /dependency-unavailable;
    }
    location = /admin { return 404; }
    location ^~ /admin/ { return 404; }
    location = /dependency-unavailable { internal; return 503; }
  }
}
