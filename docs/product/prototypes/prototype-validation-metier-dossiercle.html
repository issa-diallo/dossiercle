ations')}</div><div class="grow"><strong>${esc(m.subject)}</strong><div class="small">${esc(m.from)} · ${esc(m.date)}</div></div><button class="btn smallbtn" data-action="open-thread" data-id="${m.id}">Lire</button></div>`).join('')}</section><section class="panel pad"><div class="panelTitle"><h2>Activité récente</h2>${btn('Journal complet →','go-journal','plain smallbtn')}</div>${s.logs.slice(0,4).map(l=>`<div class="stepitem"><span class="stepnum">${ic('clock',14)}</span><div><b>${esc(l.id)}</b><div class="small">${esc(l.what)}</div><div class="micro">${esc(l.when)} · ${esc(l.by)}</div></div></div>`).join('')}</section></div>`}
function caseList(title,priorities=false,type=''){let filters=['Tous','Action humaine requise','À vérifier','Échec à reprendre','IA en cours','En attente','Traité'],subopts=['Tous','Agent IA','Isabelle S.','Léa M.','Karim B.','File administrateur'];let arr=s.cases.filter(c=>(!type||c.type===type)&&(!priorities||['ACTION','ERROR','VERIFY','NEW','HUMAN'].includes(c.status))).filter(c=>ui.filter==='Tous'||(STATUS[c.status]||[])[0]===ui.filter).filter(c=>ui.subfilter==='Tous'||c.owner===ui.subfilter).filter(c=>!ui.search||[c.title,c.id,c.contact,c.property].join(' ').toLowerCase().includes(ui.search.toLowerCase()));arr=arr.slice().sort((a,b)=>['ERROR','ACTION','VERIFY','NEW','HUMAN','AI','WAIT','DONE'].indexOf(a.status)-['ERROR','ACTION','VERIFY','NEW','HUMAN','AI','WAIT','DONE'].indexOf(b.status));let subtitle=priorities?'Demandes nécessitant votre attention. Aucune action externe sans autorisation.':type==='Sinistre'?'Suivi des signalements, artisans et interventions.':type==='Location'?'Visites et contrôle objectif de complétude des pièces.':'Tous les dossiers suivis par votre agence.';
return `${h(title,subtitle,btn(`${ic('plus')} Nouveau dossier`,'new-case','primary')+btn(`${ic('download')} Export démo`,'export-cases'))}<div class="filters"><div class="formfield"><label>État du dossier</label>${select('statusFilter',filters,ui.filter)}</div><div class="formfield"><label>Responsable</label>${select('ownerFilter',subopts,ui.subfilter)}</div><div class="formfield" style="min-width:210px;flex:1"><label>Rechercher dans les dossiers</label><input id="listSearch" class="input" placeholder="Référence, contact, bien…" value="${esc(ui.search)}"></div>${btn(`${ic('refresh')} Effacer`,'clear-filters','smallbtn')}</div><div class="panel"><div class="between" style="padding:15px 18px;border-bottom:1px solid var(--line)"><strong>${arr.length} dossier${arr.length>1?'s':''}</strong><span class="small">Données de démonstration</span></div>${arr.length?`<div class="tablewrap"><table class="table"><thead><tr><th>Dossier</th><th>Type</th><th>Statut</th><th>Responsable</th><th>Échéance</th><th>Prochaine action</th><th></th></tr></thead><tbody>${arr.map(c=>`<tr><td><a href="#" class="rowlink" data-action="open-case" data-id="${c.id}">${esc(c.title)}</a><small>${esc(c.id)} · ${esc(c.contact)}</small></td><td>${esc(c.type)}</td><td>${stat(c.status)}</td><td>${esc(c.owner)}</td><td>${esc(c.date)}</td><td>${esc(c.next)}</td><td><button class="btn smallbtn" data-action="open-case" data-id="${c.id}">Ouvrir ${ic('chevron',14)}</button></td></tr>`).join('')}</tbody></table></div>`:noResults()}</div>`}
function caseDetail(){let c=caseBy(ui.caseId);if(!c)return noResults('Dossier introuvable.');let v=s.validations.find(x=>x.caseId===c.id&&x.state==='À valider'), isLoc=c.kind==='location',tabs=['Résumé','Historique',isLoc?'Pièces':'Faits et contrôles',isLoc?'Bien':'Artisans'];let tabIndex=['resume','activity','docs','artisan'].indexOf(ui.caseTab);return `<button class="back" data-action="go-dossiers">← Retour aux dossiers</button><div class="pagehead"><div><div class="case-header">${badge(c.type,c.kind==='sinistre'?'warn':'info')} ${stat(c.status)} <span class="micro">Réf. ${esc(c.id)} · Version ${c.version||1}</span></div><h1>${esc(c.title)}</h1><p class="subtitle">${esc(c.contact)} · ${esc(c.property)}</p></div><div class="actions">${btn(`${ic('edit')} Modifier`,'edit-case')}${c.owner==='Agent IA'?btn(`${ic('shield')} Prendre la main`,'take-over','primary'):(c.agentSuspended?btn(`${ic('refresh')} Rendre à l’IA`,'release-case'): '')}</div></div><div class="grid4" style="margin-bottom:18px"><div class="panel stat"><div class="statlab">Responsable</div><div style="font-size:16px;font-weight:750;margin-top:8px">${esc(c.owner)}</div><div class="statfoot">Prise en charge suivie</div></div><div class="panel stat"><div class="statlab">Module</div><div style="font-size:16px;font-weight:750;margin-top:8px">${esc(c.type)}</div><div class="statfoot">Règles métier du module</div></div><div class="panel stat"><div class="statlab">Priorité</div><div style="margin-top:9px">${badge(c.priority||'Normale',c.priority==='Haute'?'warn':'neutral')}</div><div class="statfoot">Indication interne</div></div><div class="panel stat"><div class="statlab">Boîte d’origine</div><div style="font-size:12px;font-weight:750;margin-top:8px;overflow-wrap:anywhere">${c.kind==='sinistre'?'sinistres@agence-rivoli.example':'location@agence-rivoli.example'}</div><div class="statfoot">Provenance descriptive</div></div></div>${c.status==='ERROR'?`<div class="notice danger"><strong>Actions automatiques suspendues.</strong> La synchronisation n’est pas confirmée. Aucune nouvelle tentative d’envoi ne doit être déclenchée tant que le résultat précédent n’est pas vérifié.</div>`:''}<div class="split"><div class="stack"><section class="panel pad"><div class="tabbar">${tabs.map((t,i)=>`<button class="tab ${tabIndex===i?'active':''}" data-action="case-tab" data-tab="${['resume','activity','docs','artisan'][i]}">${esc(t)}</button>`).join('')}</div>${ui.caseTab==='resume'?`<h2>Situation actuelle</h2><p class="muted">${esc(c.description)}</p><div class="split equal" style="margin-top:18px"><div><h3>Faits confirmés</h3>${c.facts.length?c.facts.map(t=>`<div class="fact" style="margin-top:7px">${ic('check',14)} ${esc(t)}</div>`).join(''):'<div class="small">Aucun fait confirmé</div>'}</div><div><h3>À vérifier</h3>${c.verify.length?c.verify.map(t=>`<div class="fact warnbox" style="margin-top:7px">${ic('alert',14)} ${esc(t)}</div>`).join(''):'<div class="small">Aucune vérification en attente</div>'}</div></div><hr class="divider"><h3>Historique condensé</h3><ol class="timeline">${c.activity.slice(0,3).map(a=>`<li><small>${esc(a[0])} · ${esc(a[1])}</small><b>${esc(a[2])}</b></li>`).join('')}</ol>`:ui.caseTab==='activity'?`<h2>Historique d’activité</h2><ol class="timeline">${c.activity.map(a=>`<li><small>${esc(a[0])} · ${esc(a[1])}</small><p>${esc(a[2])}</p></li>`).join('')}</ol><div class="notice">Ces éléments sont des faits et résumés de démonstration, et non des copies d’e-mails originaux.</div>`:ui.caseTab==='docs'?(isLoc?`<h2>Complétude documentaire</h2><p class="small">La présence et la lisibilité sont contrôlées. Aucune évaluation de solvabilité ni décision d’acceptation.</p>${c.docRows.length?c.docRows.map(d=>`<div class="docrow"><div class="roundico ${/vérifier|manquant/i.test(d[1])?'amber':''}">${ic('file')}</div><div class="grow"><b>${esc(d[0])}</b><div class="small">Contrôle documentaire</div></div>${badge(d[1],/Vérifié|Reçu/.test(d[1])?'good':'warn')}</div>`).join(''):'<p class="small">Aucune pièce demandée à ce stade.</p>'}`:`<h2>Éléments de déclaration</h2>${c.facts.concat(c.verify).map((f,i)=>`<div class="docrow">${ic('file')} <span class="grow">${esc(f)}</span>${badge(i<c.facts.length?'Confirmé':'À vérifier',i<c.facts.length?'good':'warn')}</div>`).join('')}`):isLoc?`<h2>Bien associé</h2><p>${esc(c.property)}</p>${btn('Voir le catalogue des biens','go-biens')}`:`<h2>Artisans compatibles</h2><p class="small">Proposition indicative par métier, zone et statut actif. Toute affectation nécessite une validation humaine.</p>${s.artisans.filter(a=>a.status==='Actif').slice(0,4).map(a=>`<div class="docrow"><div class="roundico">${ic('artisans')}</div><div class="grow"><b>${esc(a.name)}</b><div class="small">${esc(a.trade)} · ${esc(a.zone)}</div></div>${btn('Proposer','offer-artisan','smallbtn',`data-id="${a.id}"`)}</div>`).join('')}`}</section></div><div class="stack"><aside class="panel pad" style="border-top:3px solid var(--primary)"><div class="eyebrow">Prochaine étape</div><h2>${esc(c.next)}</h2><p class="small">${esc(c.owner)} · ${esc(c.date)}</p>${v?`<div class="notice warn"><b>Validation humaine requise</b><br>Demande préparée par l’agent, aucune dépense autorisée.</div>${btn(`${ic('check')} Examiner la proposition`,'review-validation','primary',`data-id="${v.id}"`)}`:c.id==='DC-1036'?btn('Préparer une demande de correction','request-docs','primary'):c.id==='DC-1051'?btn('Identifier le bien','identify-property','primary'):c.status==='ERROR'?btn('Vérifier la synchronisation','repair-sync','primary'):c.status==='DONE'?'<div class="notice">Ce dossier ne nécessite pas de nouvelle action.</div>':btn('Préparer une réponse','draft-reply','primary')}</aside><aside class="panel pad"><h2>Fiche de suivi</h2><dl class="kv"><dt>Référence</dt><dd>${esc(c.id)}</dd><dt>Contact</dt><dd>${esc(c.contact)}</dd><dt>Bien</dt><dd>${esc(c.property)}</dd><dt>Responsable</dt><dd>${esc(c.owner)}</dd><dt>État</dt><dd>${esc(STATUS[c.status]?.[0]||c.status)}</dd></dl><hr class="divider">${btn('Voir la conversation','case-conversation','smallbtn')}</aside></div></div>`}
function inbox(){let m=s.messages.find(x=>x.id===ui.threadId)||s.messages[0],c=caseBy(m.caseId);let all=s.messages.filter(x=>ui.filter==='Tous'||(ui.filter==='Non lus'?!x.read:ui.filter===x.module)).filter(x=>!ui.search||[x.from,x.subject,x.email].join(' ').toLowerCase().includes(ui.search.toLowerCase()));return `${h('Conversations','Demandes entrantes, provenance et prise en charge centralisées.',btn(`${ic('plus')} Simuler une réception`,'new-message','primary'))}<div class="filters"><div class="formfield"><label>Voir</label>${select('inboxFilter',['Tous','Non lus','Sinistre','Location','À classer'],ui.filter)}</div><div class="formfield" style="flex:1"><label>Recherche</label><input id="listSearch" class="input" value="${esc(ui.search)}" placeholder="Expéditeur ou objet…"></div></div><div class="panel inbox"><div class="inbox-left"><div style="padding:15px;border-bottom:1px solid var(--line)" class="between"><b>${all.length} conversation${all.length>1?'s':''}</b>${badge('2 boîtes','green')}</div>${all.length?all.map(a=>`<button class="inbox-item ${m.id===a.id?'active':''}" data-action="open-thread" data-id="${a.id}"><span class="roundico">${ic('conversations')}</span><span class="grow" style="min-width:0"><span class="between"><b style="font-size:13px">${esc(a.from)}</b><span class="micro">${esc(a.date)}</span></span><span style="display:block;font-weight:${a.read?500:750};margin:3px 0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis">${esc(a.subject)}</span><span class="small">${esc(a.module)} · ${a.caseId||'Sans dossier'}</span></span>${!a.read?'<span class="dot" style="background:#2a8659"></span>':''}</button>`).join(''):noResults()}</div><div style="padding:23px;min-width:0"><div class="between" style="gap:12px;flex-wrap:wrap"><div><div class="eyebrow">Message entrant · ${esc(m.box)}</div><h2 style="font-size:20px">${esc(m.subject)}</h2><div class="small">${esc(m.from)} &lt;${esc(m.email)}&gt; · ${esc(m.date)}</div></div>${badge(m.module,m.module==='Sinistre'?'warn':'info')}</div><hr class="divider"><div class="message">${esc(m.text)}</div><div class="message-ai" style="margin-top:17px"><div class="flex" style="margin-bottom:7px">${ic('spark')} <strong>Synthèse proposée par l’agent IA</strong> ${badge('À confirmer','warn')}</div><div class="small">${c?esc(c.description):'Demande immobilière non classée. Le type de demande et le bien restent à confirmer.'}</div><div class="micro" style="margin-top:8px">Ce résumé n’est pas une copie de l’e-mail d’origine.</div></div><div class="between" style="margin-top:19px;gap:10px;flex-wrap:wrap"><div>${c?`<span class="small">Dossier lié</span><br><strong>${esc(c.id)} · ${esc(c.title)}</strong>`:'<strong>Cette conversation attend une classification.</strong>'}</div><div class="actions">${c?btn('Ouvrir le dossier','thread-case','primary'):btn('Créer un dossier','classify-message','primary')}${btn('Préparer une réponse','thread-reply')}</div></div></div></div>`}
function approvals(){let n=s.validations.filter(v=>v.state==='À valider').length;return `${h('Validations humaines','Chaque geste protégé exige une décision explicite, sous le mandat courant.',btn('Consulter le mandat','go-agent'))}<div class="notice">Aucun contenu n’est transmis automatiquement depuis ce prototype. Valider simule une décision et actualise le suivi local.</div><div class="panel"><div class="between" style="padding:16px 19px;border-bottom:1px solid var(--line)"><b>${n} validation${n>1?'s':''} en attente</b>${badge('Contrôle avant action','green')}</div>${s.validations.map(v=>`<div class="listrow"><div class="roundico ${v.state==='À valider'?'amber':''}">${ic('validations')}</div><div class="main"><h3>${esc(v.action)}</h3><p>${esc(v.caseId)} · Destinataire : ${esc(v.to)}</p><p style="margin-top:6px">Proposition version ${esc(v.version)} · ${esc(v.owner)}</p></div>${badge(v.state,v.state==='À valider'?'warn':v.state==='Validée'?'good':'neutral')}${v.state==='À valider'?btn('Examiner','review-validation','smallbtn primary',`data-id="${v.id}"`):''}</div>`).join('')}</div>`}
function properties(){let arr=s.properties.filter(p=>!ui.search||[p.address,p.city,p.type,p.id].join(' ').toLowerCase().includes(ui.search.toLowerCase()));return `${h('Biens immobiliers','Catalogue des lots utilisés pour rattacher les demandes et organiser les visites.',btn(`${ic('plus')} Ajouter un bien`,'new-property','primary')+btn(`${ic('download')} Export CSV`,'export-properties'))}<div class="filters"><div class="formfield" style="flex:1"><label>Rechercher un bien</label><input class="input" id="listSearch" placeholder="Adresse, référence, ville…" value="${esc(ui.search)}"></div></div><div class="grid3">${arr.length?arr.map(p=>`<div class="panel property" data-action="show-property" data-id="${esc(p.id)}" role="button" tabindex="0"><div class="propicon">${ic('building',37)}</div><div class="between"><strong>${esc(p.address)}</strong>${badge(p.status,p.status==='Disponible'?'good':p.status==='Bientôt libre'?'warn':'neutral')}</div><p>${esc(p.city)} · ${esc(p.note)}</p><div class="between"><b>${esc(p.type)} · ${esc(p.area)}</b><span class="micro">Lot ${esc(p.id)} →</span></div></div>`).join(''):noResults()}</div>`}
function artisans(){let trades=['Tous',...new Set(s.artisans.map(a=>a.trade))],arr=s.artisans.filter(a=>(ui.filter==='Tous'||ui.filter===a.trade)&&(ui.subfilter==='Tous'||ui.subfilter===a.status)&&(!ui.search||[a.name,a.trade,a.zone].join(' ').toLowerCase().includes(ui.search.toLowerCase())));return `${h('Annuaire des artisans','Référencement, spécialités et zones. Les artisans non actifs ne sont pas proposés.',btn(`${ic('plus')} Ajouter un artisan`,'new-artisan','primary')+btn(`${ic('upload')} Import CSV`,'import-artisans'))}<div class="filters"><div class="formfield"><label>Spécialité</label>${select('tradeFilter',trades,ui.filter)}</div><div class="formfield"><label>État</label>${select('artisanStatus',['Tous','Actif','À vérifier','Suspendu','Brouillon'],ui.subfilter)}</div><div class="formfield" style="flex:1"><label>Recherche</label><input class="input" id="listSearch" placeholder="Artisan, zone…" value="${esc(ui.search)}"></div></div><div class="panel"><div class="tablewrap"><table class="table"><thead><tr><th>Entreprise</th><th>Spécialité</th><th>Zone</th><th>Urgence</th><th>Justificatifs</th><th>État</th><th></th></tr></thead><tbody>${arr.map(a=>`<tr><td><b>${esc(a.name)}</b><small>${esc(a.phone)}</small></td><td>${esc(a.trade)}</td><td>${esc(a.zone)}</td><td>${esc(a.urgent)}</td><td class="muted">${esc(a.doc)}</td><td>${badge(a.status,a.status==='Actif'?'good':a.status==='Suspendu'?'bad':'warn')}</td><td>${btn('Fiche','show-artisan','smallbtn',`data-id="${a.id}"`)}</td></tr>`).join('')}</tbody></table>${arr.length?'':noResults()}</div></div><div class="notice">Importer un artisan ne vaut pas certification de ses assurances ni autorisation d’intervention. Toute affectation reste une décision humaine.</div>`}
function contacts(){let arr=s.contacts.filter(a=>!ui.search||[a.name,a.email,a.role].join(' ').toLowerCase().includes(ui.search.toLowerCase()));return `${h('Contacts','Locataires, prospects et interlocuteurs associés aux dossiers.',btn(`${ic('plus')} Nouveau contact`,'new-contact','primary'))}<div class="filters"><div class="formfield" style="flex:1"><label>Rechercher un contact</label><input class="input" id="listSearch" placeholder="Nom, e-mail, rôle…" value="${esc(ui.search)}"></div></div><div class="panel"><div class="tablewrap"><table class="table"><thead><tr><th>Contact</th><th>Rôle</th><th>Téléphone</th><th>Dossiers liés</th><th></th></tr></thead><tbody>${arr.map(a=>`<tr><td><b>${esc(a.name)}</b><small>${esc(a.email)}</small></td><td>${esc(a.role)}</td><td>${esc(a.phone)}</td><td>${s.cases.filter(c=>c.contact===a.name).length}</td><td>${btn('Voir','show-contact','smallbtn',`data-id="${a.id}"`)}</td></tr>`).join('')}</tbody></table>${arr.length?'':noResults()}</div></div>`}
function reports(){return `${h('Rapports opérationnels','Synthèses adressées aux personnes autorisées, avec historique et gestion des échecs.',btn(`${ic('download')} Export de démonstration`,'export-reports'))}<div class="grid3" style="margin-bottom:19px">${s.reports.map(r=>`<div class="panel pad"><div class="between">${ic('rapports',22)}${badge(r.state,r.state==='Envoyé'?'good':r.state==='Échec'?'bad':'info')}</div><div class="eyebrow" style="margin-top:17px">${esc(r.time)} · Aujourd’hui</div><h2>${esc(r.title)}</h2><p class="small">${esc(r.desc)}</p>${r.state==='Échec'?btn('Vérifier puis relancer','retry-report','primary smallbtn',`data-id="${r.id}"`):btn('Voir le contenu','show-report','smallbtn',`data-id="${r.id}"`)}</div>`).join('')}</div><div class="panel pad"><h2>Programmation</h2><p class="muted">Mardi 13 octobre 2026 · 3 créneaux de rapport · destinataires filtrés par leurs droits d’accès.</p><div class="notice">Après un échec d’envoi, le système doit vérifier le résultat fournisseur avant toute nouvelle tentative. Cette simulation ne contacte aucun fournisseur.</div></div>`}
function agent(){let grp={'Sinistres':Object.keys(s.mandate.values).slice(0,5),'Location':Object.keys(s.mandate.values).slice(5,10),'Communications':Object.keys(s.mandate.values).slice(10)};return `${h('Mandat de l’agent IA',`Version ${s.mandate.version} · Contrôler ce que l’agent peut faire seul, préparer ou ne pas faire.`,btn(`${ic('shield')} Sauvegarder le mandat`,'save-mandate','primary'))}<div class="notice warn"><strong>Important :</strong> les décisions d’engagement restent obligatoirement humaines. Les fonctions hors périmètre V1 (notation financière, sélection/acceptation des candidats, bail) ne sont pas configurables.</div><div class="split"><div class="stack">${Object.entries(grp).map(([g,vals])=>`<section class="panel pad"><div class="panelTitle"><h2>${esc(g)}</h2>${ic(g==='Sinistres'?'sinistres':g==='Location'?'location':'boites')}</div>${vals.map((label,i)=>`<div class="setting-row"><div><strong>${esc(label)}</strong><small>${/Affectation/.test(label)?'Action protégée, aucune autonomie autorisée.':'Le serveur doit revérifier les droits et le mandat avant l’effet externe.'}</small></div><select class="select mode-select" data-mandate="${esc(label)}"><option value="solo" ${s.mandate.values[label]==='solo'?'selected':''} ${/Affectation/.test(label)?'disabled':''}>L’agent fait seul</option><option value="validation" ${s.mandate.values[label]==='validation'?'selected':''} ${/Affectation/.test(label)?'disabled':''}>Prépare + validation humaine</option><option value="off" ${s.mandate.values[label]==='off'?'selected':''}>L’agent ne fait pas</option></select></div>`).join('')}</section>`).join('')}</div><div class="stack"><section class="panel pad"><h2>La règle des trois modes</h2><div class="stepitem"><span class="stepnum">1</span><div><strong>Fait seul</strong><div class="small">Uniquement si l’action est autorisée et non protégée.</div></div></div><div class="stepitem"><span class="stepnum">2</span><div><strong>Prépare et attend</strong><div class="small">Un humain vérifie le dossier, la version et le destinataire.</div></div></div><div class="stepitem"><span class="stepnum">3</span><div><strong>Ne fait pas</strong><div class="small">Aucune automatisation ni brouillon pour cette fonction.</div></div></div></section><section class="panel pad"><h2>Résumé de la configuration</h2>${Object.entries({solo:'Actions autonomes',validation:'Avec validation',off:'Désactivées'}).map(([k,v])=>`<div class="between" style="margin:12px 0"><span class="small">${v}</span><b>${Object.values(s.mandate.values).filter(x=>x===k).length}</b></div>`).join('')}<div class="notice">Les changements sont simulés et enregistrés localement dans ce navigateur.</div></section></div></div>`}
function mailboxes(){return `${h('Boîtes e-mail','Connexion et routage des messages vers le bon module.',btn(`${ic('plus')} Ajouter une boîte`,'new-mailbox','primary'))}<div class="notice">Les adresses ci-dessous sont fictives. Aucun compte Gmail, Microsoft 365 ou IMAP n’est connecté au prototype.</div><div class="grid3">${s.mailboxes.map(m=>`<section class="panel pad"><div class="between"><span class="roundico">${ic('boites',20)}</span>${badge(m.enabled?'Connectée · simulée':'Désactivée',m.enabled?'good':'warn')}</div><h2 style="margin:18px 0 4px;overflow-wrap:anywhere">${esc(m.address)}</h2><p class="small">${esc(m.type)} · Module : ${esc(m.area)}</p><hr class="divider"><div class="between"><span class="small">Dernière synchro simulée</span><b style="font-size:12px">${esc(m.sync)}</b></div><div class="between" style="margin-top:16px">${btn('Paramétrer','configure-mailbox','smallbtn',`data-id="${m.id}"`)}<label class="switch" title="Activer / désactiver"><input type="checkbox" data-toggle-box="${m.id}" ${m.enabled?'checked':''}><span></span></label></div></section>`).join('')}</div><div class="panel pad" style="margin-top:20px"><h2>Routage et règles de sécurité</h2><p class="small">Un message reçu peut être classé en Sinistres, Location ou À vérifier. Les doublons doivent être rapprochés sans fusion non confirmée. Les originaux restent chez le fournisseur de messagerie.</p></div>`}
function team(){return `${h('Équipe et accès','Les droits sont limités à l’agence active ; un lien UI ne vaut jamais autorisation serveur.',btn(`${ic('plus')} Inviter un collaborateur`,'invite-user','primary'))}<div class="panel"><div class="tablewrap"><table class="table"><thead><tr><th>Collaborateur</th><th>Rôle</th><th>État</th><th></th></tr></thead><tbody>${s.team.map(m=>`<tr><td><b>${esc(m.name)}</b><small>${esc(m.email)}</small></td><td>${esc(m.role)}</td><td>${badge(m.status,m.status==='Actif'?'good':'warn')}</td><td>${btn('Détails','show-user','smallbtn',`data-id="${m.id}"`)}</td></tr>`).join('')}</tbody></table></div></div><div class="notice">Exemple de configuration : trois comptes dans une agence. Les droits techniques et les accès à d’autres agences ne sont jamais simulés comme acquis automatiquement.</div>`}
function journal(){return `${h('Journal d’activité','Actions, décisions et changements de mandat, associés à leur auteur.',btn(`${ic('download')} Export CSV`,'export-journal'))}<div class="panel"><div class="tablewrap"><table class="table"><thead><tr><th>Heure</th><th>Acteur</th><th>Élément</th><th>Événement</th></tr></thead><tbody>${s.logs.map(l=>`<tr><td><b>${esc(l.when)}</b></td><td>${esc(l.by)}</td><td>${esc(l.id)}</td><td>${esc(l.what)}</td></tr>`).join('')}</tbody></table></div></div>`}
function settings(){return `${h('Paramètres de l’agence','Informations de l’espace, préférences de travail et contrôle des données.',btn(`${ic('refresh')} Réinitialiser la démo`,'reset-demo'))}<div class="split"><div class="stack"><div class="panel pad"><h2>Agence Rivoli</h2><div class="formgrid">${field('agencyName','Nom de l’agence','Agence Rivoli')}${field('agencyCity','Ville','Paris')}${field('agencyEmail','E-mail d’accueil','bonjour@agence-rivoli.example','email')}${field('agencyTime','Fuseau horaire','Europe/Paris')}</div><div style="margin-top:17px">${btn('Enregistrer les préférences','save-settings','primary')}</div></div><div class="panel pad"><h2>Protection et confidentialité</h2><div class="stepitem">${ic('shield')}<div><b>Espaces agences séparés</b><div class="small">Les données d’une agence ne doivent pas être accessibles depuis une autre.</div></div></div><div class="stepitem">${ic('boites')}<div><b>Originaux des messages</b><div class="small">Aucun original ni pièce conservée durablement dans DossierClé.</div></div></div><div class="stepitem">${ic('validations')}<div><b>Contrôle des actions protégées</b><div class="small">Version, habilitation, mandat et dossier revérifiés avant chaque action.</div></div></div></div></div><div class="panel pad"><h2>Mode démonstration</h2><p class="small">Cette version est un prototype de parcours UI. Les données et changements restent uniquement dans ton navigateur, sans connexion au backend.</p>${badge('Aucun service réel connecté','warn')}<hr class="divider">${btn('Visite guidée','guide','smallbtn')}<hr class="divider"><p class="small">La réinitialisation remplace toutes les données de démonstration par celles d’origine.</p>${btn('Effacer les changements de la démo','reset-demo','danger')}</div></div>`}
/* Parcours métier : cinq démonstrations guidées et reliées à l'état de l'agence. */
const WF={
water:{title:'Une fuite d’eau urgente',tag:'SINISTRE',icon:'sinistres',code:'DC-1042',minutes:12,summary:'Du message de la locataire jusqu’à la clôture après intervention.',steps:['Lire la déclaration','Qualifier l’urgence','Trouver un plombier','Valider la demande','Recevoir sa réponse','Confirmer l’intervention','Clôturer le dossier','Bilan du parcours']},
visit:{title:'Organiser une visite',tag:'LOCATION',icon:'location',code:'DC-1051',minutes:9,summary:'Identifier le bon appartement, proposer un créneau, obtenir confirmation.',steps:['Lire la demande','Identifier le bien','Proposer un créneau','Valider la réponse','Recevoir la confirmation','Bilan du parcours']},
docs:{title:'Faire compléter un dossier',tag:'DOCUMENTS',icon:'file',code:'DC-1036',minutes:8,summary:'Détecter les pièces manquantes, demander une correction et contrôler le retour.',steps:['Contrôler les pièces','Choisir les corrections','Valider la demande','Recevoir les pièces','Vérifier la complétude','Transmettre à l’agence','Bilan du parcours']},
incident:{title:'Reprendre l’agent IA',tag:'INCIDENT',icon:'alert',code:'DC-1028',minutes:8,summary:'Gérer une panne de synchronisation sans déclencher deux envois.',steps:['Voir l’alerte','Prendre la main','Vérifier l’historique','Réconcilier l’envoi','Rétablir la liaison','Autoriser la reprise','Bilan du parcours']},
morning:{title:'La matinée d’un directeur',tag:'PILOTAGE',icon:'home',code:'Agence Rivoli',minutes:10,summary:'Prioriser, déléguer, contrôler l’IA et vérifier le rapport opérationnel.',steps:['Lire les priorités','Attribuer un dossier','Contrôler les validations','Ajuster le mandat IA','Vérifier le rapport','Bilan du parcours']}
};
const wfDefault=()=>({water:{step:0},visit:{step:0},docs:{step:0},incident:{step:0},morning:{step:0}});
function ensureWorkflows(){if(!Array.isArray(s.feedback))s.feedback=[];if(!s.workflows)s.workflows=wfDefault();for(const k of Object.keys(WF)){if(!s.workflows[k])s.workflows[k]={step:0}}}
const wfState=()=>{ensureWorkflows();return s.workflows[ui.workflowKey]};
const wfK=(k)=>`<span class="scenario-tag">${esc(k)}</span>`;
const wfHeading=(n,desc)=>`<div class="wf-heading"><div class="wf-kicker">ÉTAPE ${wfState().step+1} SUR ${WF[ui.workflowKey].steps.length}</div><h2>${esc(n)}</h2><p>${desc}</p></div>`;
const wfSmall=(t,cls='')=>`<div class="wf-note ${cls}">${t}</div>`;
const wfButton=(label,act,cl='primary',extra='')=>btn(label+' '+ic('arrow',16),act,cl,extra);
const wfStatus=(text,sty='')=>`<span class="wf-status ${sty}">${esc(text)}</span>`;
const wfCase=()=>caseBy(WF[ui.workflowKey].code);
function workflowsIndex(){ensureWorkflows();let done=Object.values(s.workflows).filter(w=>w.done).length;
return `${h('Parcours métier interactifs','Cinq simulations complètes pour tester le logiciel en conditions proches du quotidien.')}<section class="wf-hero"><div>${wfK('ATELIER DE VALIDATION · AGENCE RIVOLI')}<h2>Un jour de travail, pas une simple succession d’écrans.</h2><p>Jouez le rôle du gestionnaire : faites des choix, validez des actions, recevez des réponses fictives et observez les dossiers évoluer partout dans l’application.</p><div class="wf-meta">${ic('shield',16)} Données fictives &nbsp; · &nbsp; Aucun e-mail réel &nbsp; · &nbsp; Progression locale</div></div><div class="wf-hero-number"><strong>${done}/5</strong><span>scénarios terminés</span></div></section><div class="wf-cardgrid">${Object.entries(WF).map(([key,w],i)=>{let st=s.workflows[key],pct=Math.round((st.step/(w.steps.length-1))*100);return `<article class="wf-card"><div class="wf-card-top"><span class="wf-index">0${i+1}</span>${wfK(w.tag)}</div><div class="wf-icon">${ic(w.icon,22)}</div><h3>${esc(w.title)}</h3><p>${esc(w.summary)}</p><div class="wf-card-mid"><span>${ic('clock',14)} ~${w.minutes} min</span><span>${w.steps.length-1} étapes actives</span></div><div class="wf-progress"><span style="width:${pct}%"></span></div><div class="between"><span class="small">${st.done?'Terminé':st.step?`Étape ${st.step+1}/${w.steps.length}`:'Pas encore commencé'}</span>${btn(st.done?'Revoir →':st.step?'Continuer →':'Commencer →','wf-start','primary smallbtn',`data-id="${key}"`)}</div></article>`}).join('')}</div><div class="wf-bottomhelp"><div>${ic('help',22)}<div><strong>Pour recueillir des retours utiles</strong><p>Demandez au professionnel de réaliser un parcours sans lui expliquer le logiciel. Notez les hésitations, les informations qu’il cherche et les décisions qu’il ne comprend pas.</p></div></div><div class="wf-bottombuttons">${btn('Exporter les retours métier (CSV)','wf-feedback-export','primary')}${btn('Réinitialiser les données de démonstration','reset-demo','')}</div></div>`}
function wfEmail(from,to,subject,body,received='Aujourd’hui · 10:42') {return `<section class="wf-email"><div class="wf-email-top">${ic('boites',18)} <strong>Message fictif reçu</strong> ${wfStatus(received)}</div><div class="wf-email-headers"><span>De</span><strong>${esc(from)}</strong><span>À</span><strong>${esc(to)}</strong><span>Objet</span><strong>${esc(subject)}</strong></div><p>${esc(body)}</p><div class="small">Contexte de démonstration : aucun message ni pièce originale n'est récupéré d'un fournisseur.</div></section>`}
function wfCaseLink(caseId){return btn('Voir dans les dossiers','wf-case','smallbtn',`data-id="${caseId}"`)}
function wfTimeline(c){return `<div class="wf-timeline"><h4>Historique du dossier</h4>${(c?.activity||[]).slice(0,5).map(x=>`<div class="wf-event"><span>${esc(x[0])}</span><div><b>${esc(x[1])}</b><p>${esc(x[2])}</p></div></div>`).join('')}</div>`}
function wfStepBody(){let key=ui.workflowKey,w=wfState(),c=wfCase(),stage=w.step;
if(key==='water'){
if(stage===0)return wfHeading('La déclaration vient d’arriver','Commencez comme un gestionnaire : lisez le signalement et ouvrez le dossier.')+wfEmail('Mme Martin · martin@example.test','sinistres@agence-rivoli.example','Fuite d’eau sous mon évier','Bonjour, je constate une fuite sous l’évier depuis ce matin. J’ai fermé l’arrivée d’eau. Pouvez-vous m’indiquer comment faire intervenir un plombier ? Merci.')+wfSmall('Le logiciel a identifié un sinistre potentiel et un logement probable. Une proposition de l’IA ne remplace pas une vérification.')+wfButton('Ouvrir et qualifier la demande','wf-water-read');
if(stage===1)return wfHeading('L’IA propose « priorité haute »','Vérifiez les faits avant de décider de la prochaine action.')+`<div class="wf-two"><div class="wf-facts"><h4>Faits provenant de la déclaration</h4><p>✓ Eau signalée sous l’évier</p><p>✓ Arrivée d’eau fermée</p><p>✓ Appartement B-312 identifié</p><p>! Étendue des dégâts inconnue</p></div><div class="wf-facts subtle"><h4>Proposition de l’agent IA</h4>${wfStatus('Priorité haute proposée','amber')}<p>Raison : fuite en cours aujourd’hui, avec éventuels dégâts non confirmés.</p><p>Spécialité : plomberie</p></div></div><div class="formfield"><label for="wf-urgency">Quelle priorité retenez-vous ?</label><select class="select" id="wf-urgency"><option value="">Choisir une priorité…</option><option value="Haute">Haute — diagnostic rapide</option><option value="Moyenne">Moyenne — suivi standard</option></select></div><div class="formfield"><label for="wf-urgency-note">Justification enregistrée au dossier</label><textarea id="wf-urgency-note" class="textarea" placeholder="Ex. Fuite signalée, arrivée d'eau coupée, étendue encore inconnue.">Fuite signalée ce matin ; arrivée d’eau fermée ; demander un diagnostic rapide et vérifier les dégâts.</textarea></div>${wfButton('Enregistrer la qualification','wf-water-qualify')}`;
if(stage===2){let eligible=s.artisans.filter(a=>a.trade==='Plomberie'&&a.status==='Actif'&&a.zone.includes('Paris 5e')&&a.urgent==='Oui'&&a.doc==='Assurance valide');return wfHeading('Choisissez un artisan réellement compatible','Les règles métier passent avant la recommandation de l’IA : spécialité, zone, état, urgence et justificatifs.')+`<div class="wf-rule">${ic('filter',18)} Filtres appliqués : <strong>Plomberie · Paris 5e · Urgences acceptées · Assurance valide · Actif</strong></div><div class="wf-optionlist">${eligible.map(a=>`<label class="wf-choice"><input type="radio" name="wf-artisan" value="${a.id}"><div class="wf-choice-content"><div class="between"><strong>${esc(a.name)}</strong>${wfStatus('Compatible','green')}</div><p>${esc(a.trade)} · ${esc(a.zone)}</p><small>${esc(a.doc)} · Urgences : ${esc(a.urgent)}</small></div></label>`).join('')||wfSmall('Aucun artisan compatible disponible. En situation réelle, l’agence devrait reprendre le dossier.','error')}</div><details class="wf-details"><summary>Pourquoi d’autres artisans ont-ils été exclus ?</summary>${s.artisans.filter(a=>a.trade==='Plomberie'&&!eligible.includes(a)).map(a=>`<p><strong>${esc(a.name)}</strong> — ${a.status!=='Actif'?'fiche non active':a.urgent!=='Oui'?'n’accepte pas les urgences':'critère de zone ou justificatif non satisfait'}</p>`).join('')}</details>${wfButton('Préparer une demande non engageante','wf-water-artisan',eligible.length?'primary':'',eligible.length?'':'disabled')}`}
if(stage===3){let v=s.validations.find(v=>v.caseId===c.id&&v.state==='À valider');return wfHeading('Relisez la demande avant validation','Une demande de diagnostic n’autorise ni dépense ni affectation contractuelle.')+`<div class="wf-approval"><div class="between"><strong>Vérification de l’envoi</strong>${wfStatus('Validation humaine obligatoire','amber')}</div><dl class="wf-dl"><dt>Dossier</dt><dd>${esc(c.id)} · version ${esc(v?.version||1)}</dd><dt>Destinataire</dt><dd>${esc(v?.to||w.artisanName)}</dd><dt>Autorisé</dt><dd>Demande de disponibilité / devis non engageante</dd><dt>Interdit</dt><dd>Commander une intervention ou engager une dépense</dd></dl><div class="wf-message-preview">${esc(v?.body||w.request||'')}</div><label class="wf-check"><input type="checkbox" id="wf-accept"> J’ai relu le contenu, le destinataire et la portée de cette demande.</label></div><div class="wf-actions">${btn('Refuser et revenir au choix','wf-water-back','')}${wfButton('Valider l’envoi fictif','wf-water-approve')}</div>`}
if(stage===4)return wfHeading('L’artisan répond à la demande','En situation réelle, cette réponse arriverait par la boîte e-mail connectée. Ici, choisissez une réponse fictive à injecter.')+wfSmall('Votre validation précédente a fait passer le dossier à « En attente ». Aucun e-mail réel n’a été envoyé.','green')+`<div class="wf-optionlist"><label class="wf-choice"><input type="radio" name="wf-water-reply" value="Jeudi 15 octobre · 10:00" checked><div class="wf-choice-content"><strong>Atelier du Centre — proposition de visite</strong><p>« Je peux effectuer un diagnostic jeudi 15 octobre à 10 h. Aucun devis accepté à ce stade. »</p></div></label><label class="wf-choice"><input type="radio" name="wf-water-reply" value="Vendredi 16 octobre · 09:00"><div class="wf-choice-content"><strong>Autre créneau proposé</strong><p>« Je suis disponible vendredi 16 octobre à 9 h. »</p></div></label></div>${wfButton('Recevoir cette réponse fictive','wf-water-reply')}`;
if(stage===5)return wfHeading('L’intervention reste sous contrôle de l’agence','L’artisan a proposé un créneau, mais il n’est pas encore contractuellement engagé.')+`<div class="wf-timebox"><div>${ic('calendar',24)}</div><div><span>Créneau proposé</span><strong>${esc(w.slot)}</strong><small>${esc(w.artisanName)} · diagnostic de plomberie</small></div></div>${wfSmall('La confirmation d’une affectation est un acte protégé : elle exige un contrôle humain distinct. Aucun paiement, devis ou commande réelle n’est créé.','warn')}<label class="wf-check"><input id="wf-confirm-intervention" type="checkbox"> Je confirme, en tant que collaborateur habilité, l’affectation fictive de l’artisan.</label>${wfButton('Confirmer l’affectation simulée','wf-water-confirm')}`;
if(stage===6)return wfHeading('Le diagnostic est terminé','Simulez la réception du compte rendu et décidez si le dossier peut être clôturé.')+`<div class="wf-facts"><h4>Compte rendu fictif de l’artisan</h4><p>• Flexible d’alimentation remplacé lors d’une intervention autorisée.</p><p>• Fuite stoppée ; zone vérifiée.</p><p>• Retour du locataire : plus d’écoulement observé.</p><p>• Aucune facture ni indemnisation décidée dans DossierClé.</p></div><label class="wf-check"><input id="wf-resolved" type="checkbox"> J’ai vérifié le compte rendu et les conditions de clôture de ce dossier simple.</label>${wfButton('Clôturer le sinistre fictif','wf-water-close')}`;
return wfDone('Sinistre clôturé, historique mis à jour','Le dossier a changé d’état. Consultez le journal d’activité ou repartez sur un autre scénario.',c)}
if(key==='visit'){
if(stage===0)return wfHeading('Un prospect demande une visite','Ce message contient une ambiguïté : deux appartements T2 sont situés rue de Rivoli.')+wfEmail('Mme Duval · duval@example.test','location@agence-rivoli.example','Visite du T2 rue de Rivoli','Bonjour, serait-il possible de visiter le T2 rue de Rivoli samedi ? Je peux me libérer à partir de 14 heures.','12 oct. · 16:52')+wfSmall('L’IA a trouvé plusieurs biens. Aucun rattachement automatique n’est permis en cas d’ambiguïté.')+wfButton('Vérifier les biens possibles','wf-visit-read');
if(stage===1)return wfHeading('À quel bien rattacher la demande ?','L’adresse seule ne suffit pas. Sélectionnez explicitement le bien indiqué par le prospect après vérification.')+`<div class="wf-optionlist">${s.properties.filter(p=>p.address.includes('Rivoli')).map(p=>`<label class="wf-choice"><input type="radio" name="wf-visit-lot" value="${esc(p.id)}"><div class="wf-choice-content"><div class="between"><strong>${esc(p.address)}</strong>${wfStatus(p.status,p.status==='Disponible'?'green':'amber')}</div><p>${esc(p.type)} · ${esc(p.area)} · lot ${esc(p.id)}</p><small>${esc(p.note)}</small></div></label>`).join('')}</div>${wfSmall('Dans une agence réelle, confirmer l’identifiant du bien avec le prospect si le message reste ambigu. Pour la démo, le choix matérialise cette clarification.','warn')}${wfButton('Confirmer le bien identifié','wf-visit-property')}`;
if(stage===2)return wfHeading('Proposez une visite','L’IA prépare des créneaux à partir des disponibilités fictives du prospect et de l’agence.')+`<div class="wf-facts"><p><b>Bien :</b> ${esc(c.property)}</p><p><b>Prospect :</b> ${esc(c.contact)}</p><p><b>Contrainte reçue :</b> samedi à partir de 14 h</p></div><div class="formfield"><label for="wf-slot">Choisir un créneau fictif</label><select id="wf-slot" class="select"><option value="">Choisir…</option><option value="Samedi 17 octobre · 14:30">Samedi 17 octobre, 14 h 30</option><option value="Samedi 17 octobre · 15:30">Samedi 17 octobre, 15 h 30</option></select></div>${wfButton('Préparer la confirmation de visite','wf-visit-slot')}`;
if(stage===3)return wfHeading('Relisez la réponse au prospect','Le brouillon contient le bon bien et le créneau choisi. Vous gardez la main sur l’envoi.')+`<div class="wf-approval"><dl class="wf-dl"><dt>À</dt><dd>duval@example.test</dd><dt>Objet</dt><dd>Proposition de visite — ${esc(c.property)}</dd><dt>Effet</dt><dd>Envoi d’une proposition, pas d’une confirmation définitive.</dd></dl><div class="wf-message-preview">Bonjour Madame Duval, nous vous proposons une visite du ${esc(c.property)} le ${esc(w.slot)}. Pouvez-vous confirmer votre disponibilité ? Bien cordialement, Agence Rivoli.</div><label class="wf-check"><input id="wf-visit-approve" type="checkbox"> J’ai vérifié le destinataire, l’adresse et le créneau.</label></div>${wfButton('Valider l’envoi fictif','wf-visit-approve')}`;
if(stage===4)return wfHeading('Le prospect confirme','Simulez la réception de la réponse et vérifiez la mise à jour du dossier et du suivi des rendez-vous.')+wfEmail('Mme Duval · duval@example.test','location@agence-rivoli.example','Re : Proposition de visite','Bonjour, je vous confirme être disponible pour le créneau proposé. Merci et à bientôt.', '14 oct. · 09:10 (simulation)')+wfButton('Enregistrer la visite confirmée','wf-visit-reply');
return wfDone('Visite confirmée dans la simulation','La date figure désormais dans le dossier. Aucune candidature n’a été évaluée ni approuvée.',c)}
if(key==='docs'){
if(stage===0)return wfHeading('Quatre pièces à contrôler','Lisez le niveau de complétude sans porter de jugement sur la candidature.')+wfDocs(c)+wfSmall('Contrôle documentaire : réception, lisibilité, date apparente et cohérence de l’identité seulement. Aucune notation ni décision d’éligibilité.','warn')+wfButton('Identifier les corrections utiles','wf-docs-read');
if(stage===1)return wfHeading('Quelles pièces demander ?', 'L’IA propose deux éléments à corriger. Vous pouvez ajuster la demande.')+`<div class="wf-optionlist"><label class="wf-choice"><input type="checkbox" name="wf-doc-pieces" value="Justificatif de domicile" checked><div class="wf-choice-content"><strong>Justificatif de domicile</strong><p>Reçu, mais illisible</p></div></label><label class="wf-choice"><input type="checkbox" name="wf-doc-pieces" value="Document complémentaire" checked><div class="wf-choice-content"><strong>Document complémentaire</strong><p>Non reçu</p></div></label></div>${wfButton('Préparer la demande de correction','wf-docs-choose')}`;

case'open-case':case'modal-case':ui.caseId=id;ui.caseTab='resume';ui.modal=null;navigation('case');break;
case'case-tab':ui.caseTab=el.dataset.tab;render();break;
case'open-thread':ui.threadId=Number(id);{let msg=s.messages.find(m=>m.id===ui.threadId);if(msg){msg.read=true;save()}}ui.page='conversations';render();break;
case'thread-case':{let t=s.messages.find(m=>m.id===ui.threadId);if(t&&t.caseId){ui.caseId=t.caseId;ui.caseTab='resume';navigation('case')}else toast('Cette conversation ne possède pas encore de dossier.')}break;
case'case-conversation':{let t=s.messages.find(m=>m.caseId===ui.caseId);if(t){ui.threadId=t.id;navigation('conversations')}else toast('Aucune conversation liée à ce dossier dans la démo.')}break;
case'classify-message':{let t=s.messages.find(x=>x.id===ui.threadId);let nc={id:newCaseId(),type:'Location',kind:'location',title:t.subject,contact:t.from,email:t.email,property:'À identifier',owner:'File administrateur',status:'NEW',priority:'Moyenne',date:'Aujourd’hui',next:'Qualifier et rattacher le bien',description:t.text,facts:[],verify:['Type de demande à confirmer','Bien à identifier'],docRows:[],activity:[[dateTime(),'Collaborateur','Dossier créé depuis une conversation.']]};s.cases.unshift(nc);t.caseId=nc.id;t.module='Location';log('Dossier créé depuis la conversation '+t.id,nc.id);ui.caseId=nc.id;navigation('case');toast('Dossier '+nc.id+' créé depuis la conversation.')}break;
case'new-case':case'new-message':case'new-property':case'new-artisan':case'import-artisans':case'new-contact':case'new-mailbox':case'invite-user':case'edit-case':case'guide':case'request-docs':case'identify-property':case'draft-reply':case'thread-reply':case'reset-demo':openModal(act);break;
case'account':openModal('account');break;case'showNotifications':openModal('notification');break;case'notification-approvals':ui.modal=null;navigation('validations');break;case'notification-todo':ui.modal=null;navigation('todo');break;
case'review-validation':openModal('review-validation',id);break;
case'show-property':case'show-artisan':case'show-contact':case'show-user':case'show-report':case'configure-mailbox':case'offer-artisan':openModal(act,id);break;
case'close-modal':closeModal();break;case'dismiss':ui.toast='';render();break;
case'clear-filters':ui.filter='Tous';ui.subfilter='Tous';ui.search='';render();break;
case'take-over':c.owner='Isabelle S.';c.status='HUMAN';c.agentSuspended=true;c.next='Action à décider par Isabelle S.';c.activity.unshift([dateTime(),'Isabelle S.','Prise en main humaine. Automatisations de ce dossier suspendues.']);log('Prise en main humaine ; IA suspendue.',c.id);toast('Vous avez pris la main sur '+c.id+'.');break;
case'release-case':c.owner='Agent IA';c.status='AI';c.agentSuspended=false;c.next='Analyser la prochaine étape sous mandat courant';c.activity.unshift([dateTime(),'Isabelle S.','Retour explicite à l’agent sous le mandat '+s.mandate.version+'.']);log('Dossier rendu à l’agent sous mandat courant.',c.id);toast('Le dossier '+c.id+' est de nouveau suivi par l’IA (simulation).');break;
case'repair-sync':c.status='AI';c.owner='Agent IA';c.next='Vérification de la reprise';c.activity.unshift([dateTime(),'Système','Résultat de synchronisation fictivement réconcilié, reprise sans double envoi.']);log('Synchronisation vérifiée dans la simulation.',c.id);toast('Synchronisation réconciliée (simulation).');break;
case'export-cases':exportCSV('dossiercle-dossiers-demo.csv',['Référence','Titre','Type','Statut','Responsable','Bien'],s.cases.map(c=>[c.id,c.title,c.type,STATUS[c.status]?.[0],c.owner,c.property]));break;
case'export-properties':exportCSV('dossiercle-biens-demo.csv',['Lot','Adresse','Ville','Type','Surface','Statut'],s.properties.map(p=>[p.id,p.address,p.city,p.type,p.area,p.status]));break;
case'export-journal':exportCSV('dossiercle-journal-demo.csv',['Heure','Acteur','Élément','Événement'],s.logs.map(l=>[l.when,l.by,l.id,l.what]));break;
case'export-reports':exportCSV('dossiercle-rapports-demo.csv',['Rapport','Heure','État'],s.reports.map(r=>[r.title,r.time,r.state]));break;
case'retry-report':{let r=s.reports.find(r=>r.id===id);if(r){r.state='Envoyé';log('Résultat fournisseur fictivement vérifié, rapport renvoyé une seule fois.','Rapports');toast('Rapport marqué envoyé après vérification simulée.')}}break;
case'save-mandate':{let values={};document.querySelectorAll('[data-mandate]').forEach(e=>values[e.dataset.mandate]=e.value);values['Affectation / engagement d’un artisan']='off';s.mandate.values=values;s.mandate.version++;log('Mandat IA version '+s.mandate.version+' enregistré.','Mandat');toast('Mandat version '+s.mandate.version+' enregistré localement.')}break;
case'reset-demo':openModal('reset-demo');break;
case'confirm-reset':s=seed();save();ui.modal=null;navigation('home');toast('Démo réinitialisée avec les données fictives initiales.');break;
case'save-settings':toast('Préférences simulées enregistrées pour cette session.');break;
case'accept-validation':case'refuse-validation':{let v=s.validations.find(x=>x.id===m?.id);if(!v)break;let cv=caseBy(v.caseId),accepted=act==='accept-validation';v.state=accepted?'Validée':'Refusée';if(cv){cv.status=accepted?'WAIT':'HUMAN';cv.next=accepted?'Attendre la réponse de l’artisan':'Réviser la demande refusée';cv.owner=accepted?'Agent IA':'Isabelle S.';cv.version=(cv.version||1)+1;cv.activity.unshift([dateTime(),'Isabelle S.',accepted?'Validation enregistrée dans la démonstration — aucun envoi effectué.':'Proposition refusée — aucun message envoyé.'])}log(accepted?'Validation enregistrée (simulation, aucun envoi).':'Demande refusée (aucun envoi).',v.caseId);ui.modal=null;toast(accepted?'Proposition validée dans la démo. Aucun e-mail réel envoyé.':'Proposition refusée ; aucun e-mail envoyé.')}break;
case'confirm-docs':{let text=$('#draft')?.value||'';c.docRows=c.docRows.map(x=>/À vérifier|Manquant/.test(x[1])?[x[0],'Correction demandée']:x);c.status='WAIT';c.next='Attendre les pièces corrigées';c.activity.unshift([dateTime(),'Isabelle S.','Demande de correction enregistrée en simulation. Aucun message réel envoyé.']);log('Demande de pièces préparée dans la démonstration.',c.id);ui.modal=null;toast('Demande de correction simulée. Aucun envoi réel.')}break;
case'confirm-property':{let pid=$('#chosenProperty')?.value,p=s.properties.find(p=>p.id===pid);if(!p){toast('Sélectionne le bien exact avant de confirmer.');break;}c.property=p.address+' · '+p.id;c.status='HUMAN';c.next='Organiser la visite';c.owner='Isabelle S.';c.activity.unshift([dateTime(),'Isabelle S.','Rattachement confirmé manuellement au lot '+pid+'.']);log('Bien '+pid+' rattaché manuellement.',c.id);ui.modal=null;toast('Bien '+pid+' rattaché à '+c.id+'.')}break;
case'save-draft':{let text=$('#draft')?.value||'';if(!text.trim()){toast('Rédige un brouillon avant de le sauvegarder.');break;}let t=ui.page==='conversations'?s.messages.find(m=>m.id===ui.threadId):null;log('Brouillon de réponse enregistré, aucun message envoyé.',t?.caseId||c?.id||'Conversations');ui.modal=null;toast('Brouillon enregistré en démo, sans envoi.')}break;
case'confirm-offer':{let a=s.artisans.find(a=>a.id==m.id);if(!a||a.status!=='Actif'){toast('Seul un artisan actif peut être proposé.');break;}let id='VAL-'+String(s.validations.length+1).padStart(3,'0');s.validations.push({id,caseId:c.id,action:'Proposition artisan · demande non engageante',to:a.name,body:'Bonjour, pouvez-vous nous communiquer vos disponibilités pour un diagnostic sans engagement de dépense ?',state:'À valider',owner:'Isabelle S.',version:c.version||1});c.status='ACTION';c.next='Examiner la demande à '+a.name;log('Proposition de '+a.name+' placée en validation.',c.id);ui.modal=null;navigation('validations');toast('Proposition ajoutée à la file des validations humaines.')}break;
case'submit-new-case':{if(!validForm('new-case'))break;let x=fd('new-case'),nc={id:newCaseId(),type:x.kind,kind:x.kind==='Sinistre'?'sinistre':'location',title:x.title,contact:x.contact,property:x.property,owner:'Isabelle S.',status:'NEW',priority:'Moyenne',date:'Aujourd’hui',next:'Qualifier la demande',description:x.description,facts:[],verify:['Informations à confirmer'],docRows:[],version:1,activity:[[dateTime(),'Isabelle S.','Dossier créé manuellement.']]};s.cases.unshift(nc);log('Dossier créé.',nc.id);ui.modal=null;ui.caseId=nc.id;navigation('case');toast(nc.id+' créé dans la démo.')}break;
case'submit-new-message':{if(!validForm('new-message'))break;let x=fd('new-message'),id=Math.max(...s.messages.map(x=>x.id),0)+1;s.messages.unshift({...x,id,date:dateTime(),box:x.module==='Sinistre'?'sinistres@agence-rivoli.example':'location@agence-rivoli.example',caseId:'',read:false});ui.threadId=id;log('Nouvelle conversation de démonstration reçue.','Conversation '+id,'Système');ui.modal=null;navigation('conversations');toast('Message fictif ajouté, sans connexion e-mail.')}break;
case'submit-new-property':{if(!validForm('new-property'))break;let x=fd('new-property');if(s.properties.some(p=>p.id===x.lot)){toast('Cette référence de lot est déjà utilisée.');break;}s.properties.unshift({id:x.lot,address:x.address,city:x.city,type:x.type,area:x.area,status:x.status,note:'Ajout manuel'});log('Bien immobilier '+x.lot+' ajouté.','Biens');ui.modal=null;navigation('biens');toast('Bien ajouté au catalogue de démonstration.')}break;
case'submit-new-artisan':{if(!validForm('new-artisan'))break;let x=fd('new-artisan');s.artisans.unshift({id:Date.now(),name:x.name,trade:x.trade,zone:x.zone,phone:x.phone,status:'À vérifier',urgent:'Non',doc:'À contrôler'});log('Artisan '+x.name+' ajouté à vérifier.','Artisans');ui.modal=null;navigation('artisans');toast('Fiche artisan créée avec état « À vérifier ».')}break;
case'submit-import':{let lines=($('#csv')?.value||'').split(/\r?\n/).filter(x=>x.trim());let count=0;for(let line of lines){let [name,trade,zone]=line.split(';').map(x=>x?.trim());if(!name||!trade||!zone||s.artisans.some(a=>a.name.toLowerCase()===name.toLowerCase()))continue;s.artisans.push({id:Date.now()+count,name,trade,zone,phone:'—',status:'À vérifier',urgent:'Non',doc:'À contrôler'});count++}log(count+' fiches d’artisans importées pour vérification.','Artisans');ui.modal=null;navigation('artisans');toast(count+' artisan(s) importé(s) en simulation.')}break;
case'submit-new-contact':{if(!validForm('new-contact'))break;let x=fd('new-contact');s.contacts.unshift({...x,id:Date.now(),cases:0});log('Contact '+x.name+' ajouté.','Contacts');ui.modal=null;navigation('contacts');toast('Contact fictif créé.')}break;
case'submit-new-mailbox':{if(!validForm('new-mailbox'))break;let x=fd('new-mailbox');if(s.mailboxes.some(m=>m.address===x.address)){toast('Cette adresse existe déjà.');break;}s.mailboxes.push({...x,id:Date.now(),status:'À connecter',sync:'Jamais',enabled:false});log('Boîte fictive ajoutée, connexion en attente.','Boîtes');ui.modal=null;navigation('boites');toast('Boîte ajoutée, aucune connexion réelle effectuée.')}break;
case'submit-invite':{if(!validForm('invite-user'))break;let x=fd('invite-user');s.team.push({...x,id:Date.now(),status:'Invitation simulée'});log('Invitation fictive créée pour '+x.email+'.','Équipe');ui.modal=null;navigation('equipe');toast('Invitation simulée, aucun e-mail envoyé.')}break;
case'submit-edit-case':{if(!validForm('edit-case'))break;let x=fd('edit-case');Object.assign(c,x);c.version=(c.version||1)+1;c.activity.unshift([dateTime(),'Isabelle S.','Fiche modifiée manuellement.']);log('Informations du dossier corrigées.',c.id);ui.modal=null;toast('Modifications enregistrées dans la démo.')}break;
}
}
function render(){save();let root=$('#app');root.innerHTML=shell();document.querySelectorAll('.table').forEach(t=>{const labels=Array.from(t.querySelectorAll('th')).map(th=>th.textContent.trim());t.querySelectorAll('tbody tr').forEach(tr=>Array.from(tr.children).forEach((td,i)=>td.setAttribute('data-label',labels[i]||'')))});document.title='DossierClé — '+(NAV.flatMap(g=>g[1]).find(n=>n[0]===ui.page)?.[1]||'Dossier');}
document.addEventListener('click',e=>{let n=e.target.closest('[data-nav]');if(n){navigation(n.dataset.nav);return}let a=e.target.closest('[data-action]');if(a){e.preventDefault();action(a.dataset.action,a.dataset.id,a);return}if(e.target.dataset.overlay){closeModal()}});
document.addEventListener('change',e=>{if(e.target.matches('[data-filter]')){let id=e.target.id,v=e.target.value;if(['statusFilter','inboxFilter','tradeFilter'].includes(id))ui.filter=v;else ui.subfilter=v;render()}else if(e.target.matches('[data-toggle-box]')){let box=s.mailboxes.find(m=>m.id==e.target.dataset.toggleBox);if(box){box.enabled=e.target.checked;box.status=box.enabled?'Connectée · simulée':'Désactivée';log('Boîte '+box.address+(box.enabled?' activée.':' désactivée.'),'Boîtes');toast('Connexion '+(box.enabled?'activée':'désactivée')+' dans la démo.')}}});
document.addEventListener('input',e=>{if(e.target.id==='listSearch'){let start=e.target.selectionStart;ui.search=e.target.value;render();let el=$('#listSearch');if(el){el.focus();el.setSelectionRange(start,start)}}else if(e.target.id==='globalSearch'){ui.search=e.target.value;ui.searching=true;if(ui.page!=='dossiers')ui.page='dossiers';render();let el=$('#globalSearch');if(el){el.focus();el.setSelectionRange(ui.search.length,ui.search.length)}}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.modal)closeModal();if(e.key==='Enter'&&e.target.matches('[role="button"][data-action]')){e.preventDefault();action(e.target.dataset.action,e.target.dataset.id,e.target)}});
ensureWorkflows();render();
})();

</script></body></html>
